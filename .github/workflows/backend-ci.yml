name: backend-ci

on:
  pull_request:
    paths:
      - "habit_list_backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "habit_list_backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_DB: terrain
          POSTGRES_USER: terrain
          POSTGRES_PASSWORD: terrain-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terrain -d terrain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: habit_list_backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: habit_list_backend/pyproject.toml
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install "pytest>=8.3,<9" "pytest-asyncio>=0.23,<1" "respx>=0.21,<1" "ruff>=0.5,<1"
      - name: Static checks
        run: python -m ruff check app tests migrations --select E,F,I --ignore E501
      - name: Unit and SQLite migration tests
        run: python -m pytest
      - name: PostgreSQL migration and startup validation
        env:
          APP_ENV: prod
          PROCESS_ROLE: api
          DATABASE_SCHEMA_MODE: alembic
          DATABASE_URL: postgresql+psycopg://terrain:terrain-ci-password@127.0.0.1:5432/terrain
          API_AUTH_TOKEN: test-user-token-000000000000000000000001
          ADMIN_TOKEN: test-admin-token-00000000000000000000001
          DASHSCOPE_API_KEY: sk-test-only-not-a-real-provider-key
          CORS_ALLOWED_ORIGINS: https://admin.example.test
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -c "import asyncio; from app.db.database import init_db; asyncio.run(init_db())"
