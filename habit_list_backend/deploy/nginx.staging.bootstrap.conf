server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        auth_basic off;
    }

    # 证书签发前不允许通过公网使用应用，避免测试对话走明文 HTTP。
    location / {
        default_type text/plain;
        return 503 "staging TLS is not ready\n";
    }
}
