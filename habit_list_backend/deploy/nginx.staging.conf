server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        auth_basic off;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${DOMAIN};

    ssl_certificate /etc/letsencrypt/live/inner-terrain-staging-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inner-terrain-staging-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:staging_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    auth_basic "Inner Terrain staging";
    auth_basic_user_file /etc/nginx/auth/staging.htpasswd;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

    location = /health {
        proxy_pass http://app:8780;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer ${STAGING_API_AUTH_TOKEN}";
    }

    location = /ready {
        proxy_pass http://app:8780;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer ${STAGING_API_AUTH_TOKEN}";
    }

    location ^~ /api/ {
        proxy_pass http://app:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer ${STAGING_API_AUTH_TOKEN}";
        # 手机原图 2-12MB（后端 media_max_image_bytes=12M、media_max_bytes=25M），
        # nginx 默认 1MB 会在网关层直接 413，这里放开到 32M 覆盖multipart 开销。
        client_max_body_size 32m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering "no" always;
    }

    location ^~ /admin/ {
        # 管理端尚未进入本轮真机测试范围，避免把未完成的管理 API 暴露出去。
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}
