[tool.poetry]
name = "habit-list-backend"
version = "0.1.0"
description = "陪伴式自我记录 App · 后端服务（四层记忆 OS + DashScope LLM/ASR/TTS）"
authors = ["qiush <qiush@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<4"
fastapi = ">=0.111,<0.116"
uvicorn = {extras = ["standard"], version = ">=0.30"}
pydantic = ">=2.8,<3"
pydantic-settings = ">=2.4,<3"
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.31,<3"}
aiosqlite = ">=0.20,<1"
apscheduler = ">=3.10.4,<4"
httpx = ">=0.27,<1"
tenacity = ">=8.5,<9"
python-multipart = ">=0.0.9,<1"
rank-bm25 = ">=0.2.2,<1"
jieba = ">=0.42.1,<1"
networkx = ">=3.3,<4"
numpy = ">=1.26,<2"
python-dotenv = ">=1.0,<2"
orjson = ">=3.10,<4"
# sqlite-vss 没有稳定的 Windows/Python 3.12 发行包；本地 Windows 自动降级为 BM25/图检索。
# Linux/macOS 可按部署环境安装，生产 Memory V2 的向量基线迁移至 PostgreSQL + pgvector。
sqlite-vss = {version = ">=0.1.2-alpha.22", markers = "sys_platform == 'linux' or sys_platform == 'darwin'", optional = true}

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9"
pytest-asyncio = ">=0.23,<1"
pytest-cov = ">=5,<6"
respx = ">=0.21,<1"
httpx = {extras = ["cli"], version = ">=0.27,<1"}
ruff = ">=0.5,<1"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B"]
ignore = ["E501"]
[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
