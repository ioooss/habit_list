name: backend-ci

on:
  push:
    paths:
      - "habit_list_backend/**"
      - ".gitea/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "habit_list_backend/**"
      - ".gitea/workflows/backend-ci.yml"

jobs:
  sqlite-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: habit_list_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: habit_list_backend/pyproject.toml
      - name: Install application and test dependencies
        run: >-
          python -m pip install .
          'pytest>=8.3,<9' 'pytest-asyncio>=0.23,<1'
          'respx>=0.21,<1' 'ruff>=0.5,<1'
      - name: Lint production identity boundary
        run: >-
          python -m ruff check
          app/identity app/admin app/api/admin app/api/v1/auth.py app/core/security.py
          tests/test_identity_auth.py tests/test_admin_auth.py
          migrations/versions/8ce4cecf534e_add_identity_sessions_and_admin_rbac.py
      - name: Run full test suite
        run: python -m pytest
      - name: Replay migrations and check schema drift
        env:
          APP_ENV: dev
          DATABASE_URL: sqlite+aiosqlite:///./data/ci-migrations.db
        run: |
          python -m alembic upgrade head
          python -m alembic check
  postgresql-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_DB: terrain
          POSTGRES_USER: terrain
          POSTGRES_PASSWORD: terrain_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terrain -d terrain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: habit_list_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application
        run: python -m pip install .
      - name: Upgrade PostgreSQL and check schema drift
        env:
          APP_ENV: dev
          DATABASE_URL: postgresql+psycopg://terrain:terrain_ci_password@127.0.0.1:5432/terrain
        run: |
          python -m alembic upgrade head
          python -m alembic check
